{{ define "main" }}
<div class="page-container">
    <div class="page-header">
        <h1>{{ .Title }}</h1>
        {{ with .Description }}
        <p class="page-description">{{ . }}</p>
        {{ end }}
    </div>
    <div class="page-content">
        {{ .Content }}
    </div>
</div>
{{ end }}
